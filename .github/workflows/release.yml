name: Release

# A pushed version tag (v0.9.1) becomes a GitHub release, its notes taken from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Release notes from CHANGELOG.md
        run: .github/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "RageKit ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"

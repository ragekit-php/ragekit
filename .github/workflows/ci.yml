name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (tests + demos)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # ffi: the crypto and keyring tests call the modules' real libraries; sodium: reference values.
          extensions: mbstring, ffi, sodium
          ini-values: ffi.enable=true
          tools: composer
          coverage: none

      - name: System packages
        # libphp8.4-embed and php8.4-dev (for normal builds) come from the PHP PPA, which
        # setup-php doesn't leave configured.
        run: |
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache git tar xvfb x11-utils \
            libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 libinput10 libgbm1 libudev1 \
            libx11-xcb1 libxcursor1 libxi6 libxrandr2 libxtst6 imagemagick \
            php8.4-dev libphp8.4-embed cmake libgmp-dev libmpfr-dev \
            libcurl4-openssl-dev \
            fonts-noto-color-emoji libharfbuzz0b libsecret-1-0 gnome-keyring dbus openssh-client python3-gi gir1.2-glib-2.0 gir1.2-gtk-3.0 libglib2.0-bin xdg-utils \
            dpkg-dev fakeroot desktop-file-utils

      # Every e2e test builds its app again (normal and Nano), mostly from the same C++: g++ goes
      # through ccache, whose cache carries over from the previous run.
      - name: ccache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-

      # The pinned toolchain (TypePHP + Slint) and the third-party code kits and modules fetch.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ragekit/toolchains
            kits/*/library
            modules/*/native/third_party
          key: toolchain-${{ runner.os }}-${{ hashFiles('toolchain/**', 'kits/*/kit.yml', 'modules/*/module.yml') }}

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: ragekit setup
        run: php bin/ragekit setup

      - name: ragekit doctor
        run: php bin/ragekit doctor

      - name: PHPUnit
        run: vendor/bin/phpunit

      # Every e2e test (tests/e2e/all.sh lists them), three at once, each on its own Xvfb display.
      # Normal builds link Ubuntu's libphp8.4-embed (see docs/toolchain.md).
      - name: e2e tests
        run: tests/e2e/all.sh -j 3

      - name: ccache statistics
        if: always()
        run: ccache --show-stats
